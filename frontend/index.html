<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Todo List</h1>
            <p>Manage your tasks efficiently</p>
        </header>

        <div class="add-todo">
            <input type="text" id="todoInput" placeholder="Enter a new task..." maxlength="100">
            <button onclick="addTodo()">Add Todo</button>
        </div>

        <div class="filters">
            <button onclick="filterTodos('all')" class="active">All</button>
            <button onclick="filterTodos('active')">Active</button>
            <button onclick="filterTodos('completed')">Completed</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="todoCount">0 tasks</span>
            <button onclick="clearCompleted()" class="clear-btn">Clear Completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
