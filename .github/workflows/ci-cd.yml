name: Todo App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        
    - name: Run tests
      run: |
        # Add your backend tests here
        echo "Backend tests would run here"
        
  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build backend image
      run: docker build -t todo-backend:latest ./backend
      
    - name: Build frontend image
      run: docker build -t todo-frontend:latest ./frontend
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push images to Docker Hub
      run: |
        docker tag todo-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
        docker tag todo-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest